
version: 2

models:
  - name: dim_emp_test
    description: "It contains employee info"
    columns:
      - name: id
        description: "The primary key for this table"
        # only 4 built in tests unique, not null , accepted_values , (relationships : to : sourcename field : column name)
        data_tests:
          - unique
          - not_null

      - name: country
        description: "This contains country information"
        data_tests:
          - not_null
          - accepted_values:
              values:
                - india
                - India
                - IND
  
