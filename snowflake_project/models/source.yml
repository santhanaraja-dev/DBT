

version: 2

sources:
  - name: raw
    description: Raw source tables

    database: PRACTICAL
    schema: TEST

    tables:
      - name: EMP_TEST
        description: "It contains employee-test info"
        columns:
          - name: id
            tests:
              - unique
        config:
          loaded_at_field : LOAD_TIMESTAMP

          freshness:
            warn_after:
              count: 1
              period: hour
              
            error_after:
              count: 2
              period: hour


      - name: EMPLOYEES
        description: "It contains employee info"

      - name: CUSTOMERS
        description: "It contains customers info"

      - name: CUSTOMER_RAW
        description: "It contains customer-raw info"
